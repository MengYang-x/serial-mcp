[project]
name = "spes-serial-mcp"
version = "0.1.3"
description = "基于 MCP 协议的本地串口通信服务，内置实时 Web 监控面板"
readme = "README.md"
authors = [
    { name = "monyang", email = "mengyang@cvte.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "pyserial>=3.5",
    "websockets>=16.0",
]

[project.scripts]
spes-serial-mcp = "spes_serial_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
