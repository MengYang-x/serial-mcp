<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial MCP</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23818cf8'/%3E%3Crect x='14' y='23' width='36' height='18' rx='9' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='24' cy='32' r='3.2' fill='white'/%3E%3Ccircle cx='32' cy='32' r='3.2' fill='white'/%3E%3Ccircle cx='40' cy='32' r='3.2' fill='white'/%3E%3C/svg%3E">
    <style>
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --bg-elevated: rgba(255, 255, 255, 0.92);
            --bg-panel: rgba(255, 255, 255, 0.84);
            --bg-panel-strong: rgba(255, 255, 255, 0.94);
            --bg-terminal: #f6f6f7;
            --border: rgba(60, 60, 67, 0.16);
            --border-strong: rgba(60, 60, 67, 0.24);
            --text: #3c3c43;
            --text-soft: #67676c;
            --accent: #5672cd;
            --accent-strong: #3451b2;
            --accent-soft: rgba(100, 108, 255, 0.14);
            --signal: #3a5ccc;
            --warning: #d97706;
            --danger: #e0575e;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.07);
            --scrollbar-thumb: rgba(86, 114, 205, 0.46);
            --scrollbar-thumb-hover: rgba(52, 81, 178, 0.66);
            --radius: 14px;
            --font-ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        }

        :root.theme-dark,
        body.theme-dark {
            color-scheme: dark;
            --bg: #1b1b1f;
            --bg-elevated: rgba(32, 33, 39, 0.92);
            --bg-panel: rgba(32, 33, 39, 0.86);
            --bg-panel-strong: rgba(32, 33, 39, 0.96);
            --bg-terminal: #161618;
            --border: rgba(60, 63, 68, 0.32);
            --border-strong: rgba(60, 63, 68, 0.44);
            --text: #dfdfd6;
            --text-soft: #98989f;
            --accent: #818cf8;
            --accent-strong: #c7d2fe;
            --accent-soft: rgba(129, 140, 248, 0.16);
            --signal: #6366f1;
            --warning: #ffb14d;
            --danger: #f87171;
            --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.28);
            --scrollbar-thumb: rgba(129, 140, 248, 0.48);
            --scrollbar-thumb-hover: rgba(99, 102, 241, 0.7);
        }

        * { box-sizing: border-box; }

        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-track,
        *::-webkit-scrollbar-corner { background: transparent; }
        *::-webkit-scrollbar-thumb {
            min-height: 24px;
            border-radius: 999px;
            border: 3px solid transparent;
            background: var(--scrollbar-thumb);
            background-clip: content-box;
        }
        *::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
            background-clip: content-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        button, input, select { font: inherit; color: inherit; }
        input, .terminal, .terminal * {
            user-select: text;
            -webkit-user-select: text;
        }
        button { border: none; background: none; cursor: pointer; }
        .hidden { display: none !important; }

        /* ---------- 顶层布局 ---------- */
        .app-shell {
            height: 100vh;
            padding: 0 8px 8px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 6px;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            min-height: 52px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 0 0 calc(var(--radius) + 4px) calc(var(--radius) + 4px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .status-pill, .ws-pill {
            display: inline-grid;
            grid-template-columns: auto auto;
            gap: 8px;
            align-items: center;
            border-radius: 14px;
            border: 1px solid var(--border-strong);
            background:
                radial-gradient(circle at 0% 0%, rgba(34, 197, 94, 0.12), transparent 50%),
                rgba(255, 255, 255, 0.22);
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
        }
        body.theme-dark .status-pill, body.theme-dark .ws-pill {
            background:
                radial-gradient(circle at 0% 0%, rgba(34, 197, 94, 0.12), transparent 50%),
                rgba(15, 24, 32, 0.72);
        }
        .status-pill { padding: 6px 12px 6px 10px; cursor: pointer; }
        .ws-pill { padding: 8px 12px; justify-self: end; }
        .status-pill:hover, .ws-pill:hover { transform: translateY(-1px); }
        .status-pill:focus-visible {
            outline: none;
            border-color: rgba(86, 114, 205, 0.4);
            box-shadow: 0 0 0 4px rgba(86, 114, 205, 0.1);
        }

        .status-pill-copy { display: grid; gap: 2px; min-width: 0; }
        .status-pill-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.04em;
            line-height: 1;
            white-space: nowrap;
        }
        .status-pill-subtitle {
            font-size: 10px;
            color: var(--text-soft);
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ws-pill-text { font-size: 11px; font-weight: 700; white-space: nowrap; }

        /* ---------- 主题切换 ---------- */
        .corner-block { justify-self: end; }
        .theme-toggle {
            position: relative;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--bg-panel-strong);
        }
        .theme-toggle::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 50%;
            border-radius: 8px;
            background: var(--accent);
            transition: transform 0.2s ease;
            pointer-events: none;
        }
        .theme-toggle.is-dark::before { transform: translateX(100%); }
        .theme-opt {
            position: relative;
            z-index: 1;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
            transition: color 0.16s ease;
            white-space: nowrap;
        }
        .theme-opt.is-active { color: #eef2ff; }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            position: relative;
            flex: 0 0 auto;
        }
        .status-dot::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.5;
            animation: pulse 1.9s infinite ease-out;
        }
        .status-dot.connected { color: #22c55e; background: #22c55e; }
        .status-dot.offline { color: var(--danger); background: var(--danger); }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            70%, 100% { transform: scale(2.4); opacity: 0; }
        }

        /* ---------- 工作区与面板 ---------- */
        .workspace {
            min-height: 0;
            height: 100%;
            display: grid;
            grid-template-columns: 286px minmax(320px, 1fr);
            gap: 8px;
            align-items: stretch;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius);
            min-height: 0;
            padding: 14px 16px;
        }

        .config-panel { height: fit-content; }

        .panel-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .config-head-group {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 12px;
            min-width: 0;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .device-meta-stack { display: inline-flex; gap: 10px; justify-content: flex-end; }
        .device-meta-line {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            min-width: 0;
            font-size: 9px;
            line-height: 1;
            color: var(--text-soft);
            white-space: nowrap;
        }
        .device-meta-line strong {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .device-meta-line span {
            max-width: 96px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
            font-weight: 600;
            color: var(--text);
        }

        /* ---------- 连接管理 ---------- */
        .connect-control-box { display: block; width: 100%; min-width: 0; }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .field { display: grid; gap: 8px; min-width: 0; }
        .field label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-soft);
        }

        .primary-btn, .secondary-btn, .wide-send-btn {
            border-radius: 14px;
            transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
        }
        .primary-btn:hover, .secondary-btn:hover, .wide-send-btn:hover { transform: translateY(-1px); }

        .primary-btn, .wide-send-btn {
            background: var(--accent);
            color: #eef2ff;
            box-shadow: 0 12px 24px rgba(86, 114, 205, 0.24);
            font-weight: 800;
        }
        .primary-btn {
            width: 100%;
            padding: 9px 10px;
            font-size: 12.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .primary-btn.is-disconnect {
            background: linear-gradient(135deg, #dc5b52, #b93a32);
            color: #fff8f7;
            box-shadow: 0 12px 24px rgba(185, 58, 50, 0.24);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.44);
            border: 1px solid var(--border-strong);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px;
        }
        body.theme-dark .secondary-btn {
            background: rgba(18, 28, 37, 0.92);
        }
        .secondary-btn:hover { border-color: rgba(86, 114, 205, 0.5); }

        /* 保存/清空按钮的专业配色 */
        #save-log-btn {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border-color: rgba(16, 185, 129, 0.45);
            color: #047857;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.14);
        }
        #save-log-btn:hover {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: rgba(16, 185, 129, 0.65);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.2);
        }
        #clear-log-btn {
            background: linear-gradient(135deg, #fef2f2, #fde8e8);
            border-color: rgba(224, 87, 94, 0.4);
            color: #c0353c;
            box-shadow: 0 4px 12px rgba(224, 87, 94, 0.12);
        }
        #clear-log-btn:hover {
            background: linear-gradient(135deg, #fde8e8, #fbd5d5);
            border-color: rgba(224, 87, 94, 0.6);
            box-shadow: 0 6px 16px rgba(224, 87, 94, 0.18);
        }
        body.theme-dark #save-log-btn {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.08));
            border-color: rgba(52, 211, 153, 0.4);
            color: #34d399;
            box-shadow: none;
        }
        body.theme-dark #save-log-btn:hover {
            background: rgba(16, 185, 129, 0.3);
            border-color: rgba(52, 211, 153, 0.6);
        }
        body.theme-dark #clear-log-btn {
            background: linear-gradient(135deg, rgba(224, 87, 94, 0.2), rgba(224, 87, 94, 0.08));
            border-color: rgba(248, 113, 113, 0.4);
            color: #f87171;
            box-shadow: none;
        }
        body.theme-dark #clear-log-btn:hover {
            background: rgba(224, 87, 94, 0.3);
            border-color: rgba(248, 113, 113, 0.6);
        }

        .field input, .field select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--bg-panel-strong);
            color: var(--text);
            outline: none;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }
        .field input { font-family: var(--font-mono); font-size: 12px; }
        .field select { font-size: 12px; cursor: pointer; }
        .field input:focus, .field select:focus {
            border-color: rgba(86, 114, 205, 0.6);
            box-shadow: 0 0 0 4px rgba(86, 114, 205, 0.12);
        }
        .field input:disabled, .field select:disabled { opacity: 0.55; cursor: not-allowed; }

        /* ---------- 监视器面板 ---------- */
        .monitor-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;
        }

        .monitor-body {
            min-height: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .monitor-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }
        .button-row { display: inline-flex; gap: 8px; }
        .monitor-toolbar-copy {
            min-width: 0;
            flex: 1 1 auto;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .monitor-toolbar-copy .panel-title { flex: 0 0 auto; white-space: nowrap; }
        .monitor-live-meta { min-width: 0; flex: 1 1 auto; justify-content: flex-start; gap: 10px; overflow: hidden; }

        .terminal-wrap {
            position: relative;
            min-height: 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
        }
        .terminal {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            border-radius: 18px;
            padding: 14px;
            border: 1px solid var(--border);
            background: var(--bg-terminal);
            box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.06);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
        }

        .terminal-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
            color: var(--text-soft);
            font-size: 12px;
            letter-spacing: 0.06em;
        }

        .terminal-jump-btn {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: var(--accent);
            color: #eef2ff;
            box-shadow: 0 12px 24px rgba(52, 81, 178, 0.22);
            display: grid;
            place-items: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 2;
        }
        .terminal-jump-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .terminal-jump-btn svg {
            width: 16px;
            height: 16px;
            display: block;
            stroke: currentColor;
        }

        /* 日志行:时间 | 方向 | 来源 | 内容 */
        .log-line {
            display: grid;
            grid-template-columns: auto auto auto minmax(0, 1fr);
            gap: 10px;
            align-items: start;
            padding: 2px 0;
        }
        .log-line .stamp {
            color: var(--text-soft);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            user-select: none;
        }
        .log-line .dir {
            font-weight: 800;
            min-width: 28px;
            user-select: none;
        }
        .log-line.rx .dir { color: var(--signal); }
        .log-line.tx .dir { color: var(--warning); }
        .log-line.sys .dir { color: var(--accent); }
        .log-line.error .dir { color: var(--danger); }

        .src-chip {
            display: inline-flex;
            align-items: center;
            margin-top: 2px;
            padding: 1px 6px;
            border-radius: 7px;
            border: 1px solid currentColor;
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 800;
            line-height: 1.15;
            white-space: nowrap;
            user-select: none;
        }
        .chip-rx { color: var(--signal); background: rgba(99, 102, 241, 0.12); }
        .chip-ai { color: var(--accent-strong); background: var(--accent-soft); }
        .chip-manual { color: var(--warning); background: rgba(255, 177, 77, 0.12); }
        .chip-sys { color: var(--text-soft); background: rgba(152, 152, 159, 0.1); }

        .log-line .payload {
            min-width: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ---------- 发送区 ---------- */
        .send-main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 132px;
            gap: 5px;
            align-items: stretch;
            flex: 0 0 auto;
        }
        #cmd-input {
            width: 100%;
            min-height: 56px;
            padding: 9px 11px;
            border-radius: 16px;
            border: 1px solid var(--border-strong);
            background: var(--bg-panel-strong);
            color: var(--text);
            outline: none;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.55;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }
        #cmd-input:focus {
            border-color: rgba(86, 114, 205, 0.6);
            box-shadow: 0 0 0 4px rgba(86, 114, 205, 0.12);
        }
        #cmd-input::placeholder { color: var(--text-soft); }
        .wide-send-btn {
            min-height: 56px;
            padding: 10px 12px;
            font-size: 14px;
            letter-spacing: 0.04em;
            border-radius: 16px;
        }

        /* ---------- 问题反馈 ---------- */
        .feedback-link {
            position: fixed;
            left: 14px;
            bottom: 8px;
            z-index: 10;
            font-size: 12px;
            color: var(--text-soft);
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }

        /* ---------- 窄屏适配 ---------- */
        @media (max-width: 720px) {
            .workspace {
                grid-template-columns: minmax(0, 1fr);
                overflow: auto;
            }
            .monitor-panel { min-height: 320px; }
        }
    </style>
    <script>
        // 尽早应用主题,避免加载时闪烁(默认浅色)
        (() => {
            let theme = 'light';
            try {
                const t = localStorage.getItem('spes-serial-mcp:theme');
                if (t === 'dark' || t === 'light') theme = t;
            } catch (error) {}
            document.documentElement.classList.toggle('theme-dark', theme === 'dark');
            window.__initialTheme = theme;
        })();
    </script>
</head>
<body spellcheck="false">
    <div class="app-shell">
        <!-- 顶栏:串口状态胶囊 + WebSocket 状态 -->
        <header class="topbar">
            <section class="brand-block">
                <div id="serial-status-pill" class="status-pill" title="点击连接/断开串口">
                    <span id="serial-status-dot" class="status-dot offline"></span>
                    <div class="status-pill-copy">
                        <span class="status-pill-title">Serial MCP</span>
                        <span id="serial-status-text" class="status-pill-subtitle">串口离线</span>
                    </div>
                </div>
            </section>
            <section class="corner-block">
                <div id="theme-toggle" class="theme-toggle" role="group" aria-label="主题选择">
                    <button type="button" class="theme-opt" data-theme="light">浅色</button>
                    <button type="button" class="theme-opt" data-theme="dark">深色</button>
                </div>
            </section>
            <div id="ws-status-pill" class="ws-pill" title="点击重连">
                <span id="ws-status-dot" class="status-dot offline"></span>
                <span id="ws-status-text" class="ws-pill-text">WebSocket 未连接</span>
            </div>
        </header>

        <main class="workspace">
            <!-- 连接管理面板 -->
            <section class="panel config-panel">
                <div class="panel-head">
                    <div class="config-head-group">
                        <div class="panel-title">设备连接管理</div>
                        <div class="device-meta-stack">
                            <div class="device-meta-line">
                                <strong>端口</strong>
                                <span id="meta-port">-</span>
                            </div>
                            <div class="device-meta-line">
                                <strong>波特率</strong>
                                <span id="meta-baud">-</span>
                            </div>
                        </div>
                    </div>
                    <div class="connect-control-box">
                        <button id="connect-btn" class="primary-btn">连接设备 | 当前未连接</button>
                    </div>
                </div>
                <div class="config-grid">
                    <div class="field">
                        <label for="serial-port-input">串口端口</label>
                        <select id="serial-port-input">
                            <option value="">请选择串口</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="serial-baud-select">波特率</label>
                        <select id="serial-baud-select">
                            <option value="9600">9600</option>
                            <option value="19200">19200</option>
                            <option value="38400">38400</option>
                            <option value="57600">57600</option>
                            <option value="115200" selected>115200</option>
                            <option value="230400">230400</option>
                            <option value="460800">460800</option>
                            <option value="921600">921600</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- 串口监视器面板 -->
            <section class="panel monitor-panel">
                <div class="monitor-toolbar">
                    <div class="monitor-toolbar-copy">
                        <div class="panel-title">串口监视器</div>
                        <div class="device-meta-stack monitor-live-meta">
                            <div class="device-meta-line">
                                <strong>TX</strong>
                                <span id="meta-tx">0</span>
                            </div>
                            <div class="device-meta-line">
                                <strong>RX</strong>
                                <span id="meta-rx">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="button-row">
                        <button id="save-log-btn" class="secondary-btn">保存LOG</button>
                        <button id="clear-log-btn" class="secondary-btn">清空缓存</button>
                    </div>
                </div>
                <div class="monitor-body">
                    <div class="terminal-wrap">
                        <div id="log-container" class="terminal"></div>
                        <div id="terminal-empty" class="terminal-empty">等待串口数据…</div>
                        <button id="jump-btn" class="terminal-jump-btn" type="button" title="到底部" aria-label="滚动到底部">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 5v12"></path>
                                <path d="M7 12l5 5 5-5"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="send-main">
                        <input type="text" id="cmd-input" placeholder="输入指令发送至串口,Enter 发送,↑↓ 切换历史" autocomplete="off" spellcheck="false">
                        <button id="send-btn" class="wide-send-btn">立即发送</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="feedback-link">MCP V{VERSION}<br>Author: mengyang@cvte.com</div>

    <script>
        const logContainer = document.getElementById('log-container');
        const terminalEmpty = document.getElementById('terminal-empty');
        const jumpBtn = document.getElementById('jump-btn');
        const cmdInput = document.getElementById('cmd-input');
        const clearBtn = document.getElementById('clear-log-btn');
        const saveLogBtn = document.getElementById('save-log-btn');
        const serialStatusPill = document.getElementById('serial-status-pill');
        const serialStatusDot = document.getElementById('serial-status-dot');
        const serialStatusText = document.getElementById('serial-status-text');
        const wsStatusPill = document.getElementById('ws-status-pill');
        const wsStatusDot = document.getElementById('ws-status-dot');
        const wsStatusText = document.getElementById('ws-status-text');
        const connectBtn = document.getElementById('connect-btn');
        const serialPortInput = document.getElementById('serial-port-input');
        const serialBaudSelect = document.getElementById('serial-baud-select');
        const metaPort = document.getElementById('meta-port');
        const metaBaud = document.getElementById('meta-baud');
        const metaTx = document.getElementById('meta-tx');
        const metaRx = document.getElementById('meta-rx');
        const themeToggle = document.getElementById('theme-toggle');

        // ---- 主题切换(默认浅色,记忆上次选择) ----
        const THEME_KEY = 'spes-serial-mcp:theme';

        function applyTheme(theme) {
            document.documentElement.classList.toggle('theme-dark', theme === 'dark');
            document.body.classList.toggle('theme-dark', theme === 'dark');
            themeToggle.classList.toggle('is-dark', theme === 'dark');
            themeToggle.querySelectorAll('.theme-opt').forEach((btn) => {
                btn.classList.toggle('is-active', btn.dataset.theme === theme);
            });
            try { localStorage.setItem(THEME_KEY, theme); } catch (error) {}
        }
        applyTheme(window.__initialTheme || 'light');

        themeToggle.addEventListener('click', (e) => {
            const btn = e.target.closest('.theme-opt');
            if (btn) applyTheme(btn.dataset.theme);
        });

        const wsPort = {WS_PORT};
        const wsUrl = 'ws://' + window.location.hostname + ':' + wsPort;
        let ws;

        // ---- 命令历史 ----
        const commandHistory = [];
        let historyIndex = -1;
        let draftInput = '';

        // ---- 串口状态 ----
        let serialState = { connected: false, port: null, baudrate: 115200 };
        let txCount = 0;
        let rxCount = 0;

        const SOURCE_META = {
            LLM:           { dir: 'TX',  cls: 'tx',    chip: 'AI 发出',    chipCls: 'chip-ai' },
            HARDWARE:      { dir: 'RX',  cls: 'rx',    chip: '下位机 返回', chipCls: 'chip-rx' },
            USER_OVERRIDE: { dir: 'TX',  cls: 'tx',    chip: '手动 发送',  chipCls: 'chip-manual' },
            SYSTEM:        { dir: 'SYS', cls: 'sys',   chip: '系统',       chipCls: 'chip-sys' }
        };

        function pad2(n) { return String(n).padStart(2, '0'); }

        function fmtStamp() {
            const d = new Date();
            return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds())
                + '.' + Math.floor(d.getMilliseconds() / 100);
        }

        function fmtFileStamp() {
            const d = new Date();
            return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
                + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
        }

        function setDot(el, connected) {
            el.classList.toggle('connected', connected);
            el.classList.toggle('offline', !connected);
        }

        // ---- 日志 ----
        function isNearBottom() {
            return logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 48;
        }

        function scrollToBottom() {
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function appendLog(source, msg) {
            const base = SOURCE_META[source] || SOURCE_META.SYSTEM;
            const meta = Object.assign({}, base);
            if (source === 'SYSTEM' && /失败|错误/.test(msg || '')) meta.cls = 'error';

            if (source === 'HARDWARE') {
                rxCount++;
                metaRx.textContent = rxCount;
            } else if (source === 'LLM' || source === 'USER_OVERRIDE') {
                txCount++;
                metaTx.textContent = txCount;
            }

            const stick = isNearBottom();

            const line = document.createElement('div');
            line.className = 'log-line ' + meta.cls;

            const stamp = document.createElement('span');
            stamp.className = 'stamp';
            stamp.textContent = '[' + fmtStamp() + ']';

            const dir = document.createElement('span');
            dir.className = 'dir';
            dir.textContent = meta.dir;

            const chip = document.createElement('span');
            chip.className = 'src-chip ' + meta.chipCls;
            chip.textContent = meta.chip;

            const payload = document.createElement('span');
            payload.className = 'payload';
            payload.textContent = (msg || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

            line.append(stamp, dir, chip, payload);
            logContainer.appendChild(line);
            terminalEmpty.classList.add('hidden');

            if (stick) {
                scrollToBottom();
            } else {
                jumpBtn.classList.add('visible');
            }
        }

        // ---- WebSocket ----
        function connectWs() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                wsStatusText.textContent = 'WebSocket 已连接';
                setDot(wsStatusDot, true);
                appendLog('SYSTEM', '监控面板已连接至 MCP 底层服务。');
                requestPorts();
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'status') {
                    serialState = {
                        connected: data.connected,
                        port: data.port,
                        baudrate: data.baudrate
                    };
                    updateSerialUI();
                } else if (data.type === 'ports') {
                    renderPorts(data.ports || []);
                } else {
                    appendLog(data.source, data.msg);
                }
            };
            ws.onclose = () => {
                wsStatusText.textContent = 'WebSocket 已断开,3 秒后重连';
                setDot(wsStatusDot, false);
                // 断线时重置串口状态显示
                serialState = { connected: false, port: null, baudrate: 115200 };
                updateSerialUI();
                setTimeout(connectWs, 3000);
            };
        }

        // ---- 串口端口下拉 ----
        function requestPorts() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'list_ports' }));
            }
        }

        function setSelectValue(select, value) {
            if (value && !Array.from(select.options).some((o) => o.value === value)) {
                const opt = document.createElement('option');
                opt.value = value;
                opt.textContent = value;
                select.appendChild(opt);
            }
            select.value = value;
        }

        function renderPorts(ports) {
            // 已连接或已选中的端口即使不在扫描结果中也要保留
            const keep = serialPortInput.disabled ? (serialState.port || '') : serialPortInput.value;
            const items = ports.map((p) => ({
                value: p.device,
                label: p.device + (p.description ? ' - ' + p.description : '')
            }));
            if (keep && !items.some((p) => p.value === keep)) items.push({ value: keep, label: keep });
            const signature = JSON.stringify(items) + '|' + keep;
            if (serialPortInput.dataset.portsSig === signature) return; // 列表无变化时不重绘,避免关闭下拉弹层
            serialPortInput.dataset.portsSig = signature;
            serialPortInput.innerHTML = '';
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = items.length ? '请选择串口' : '未发现串口';
            serialPortInput.appendChild(emptyOpt);
            for (const p of items) {
                const opt = document.createElement('option');
                opt.value = p.value;
                opt.textContent = p.label;
                serialPortInput.appendChild(opt);
            }
            if (keep) setSelectValue(serialPortInput, keep);
        }

        serialPortInput.addEventListener('click', requestPorts);

        // ---- 串口操作 ----
        function toggleSerial() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendLog('SYSTEM', 'WebSocket 未连接,无法操作串口。');
                return;
            }
            if (serialState.connected) {
                ws.send(JSON.stringify({ action: 'close' }));
            } else {
                const port = serialPortInput.value.trim();
                const baud = parseInt(serialBaudSelect.value, 10);
                if (!port) {
                    appendLog('SYSTEM', '请先选择串口端口。');
                    return;
                }
                ws.send(JSON.stringify({ action: 'connect', payload: { port, baudrate: baud } }));
            }
        }

        function updateSerialUI() {
            if (serialState.connected) {
                serialStatusText.textContent = serialState.port + ' · ' + serialState.baudrate;
                serialStatusPill.title = '点击断开串口';
                setDot(serialStatusDot, true);
                connectBtn.textContent = '断开连接 | ' + serialState.port;
                connectBtn.classList.add('is-disconnect');
                metaPort.textContent = serialState.port;
                metaBaud.textContent = serialState.baudrate;
                setSelectValue(serialPortInput, serialState.port || '');
                serialPortInput.disabled = true;
                serialBaudSelect.value = String(serialState.baudrate || 115200);
                serialBaudSelect.disabled = true;
            } else {
                serialStatusText.textContent = '串口离线';
                serialStatusPill.title = '点击连接串口';
                setDot(serialStatusDot, false);
                connectBtn.textContent = '连接设备 | 当前未连接';
                connectBtn.classList.remove('is-disconnect');
                metaPort.textContent = '-';
                metaBaud.textContent = '-';
                serialPortInput.disabled = false;
                serialBaudSelect.disabled = false;
            }
        }

        function sendCommand() {
            const cmd = cmdInput.value.trim();
            if (!cmd) return;
            if (!serialState.connected) {
                appendLog('SYSTEM', '串口未连接,无法发送。');
                return;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'write', payload: cmd }));
                commandHistory.push(cmd);
                if (commandHistory.length > 50) commandHistory.shift();
                historyIndex = -1;
                draftInput = '';
                cmdInput.value = '';
            }
        }

        // ---- 事件绑定 ----
        connectBtn.addEventListener('click', toggleSerial);
        serialStatusPill.addEventListener('click', toggleSerial);
        wsStatusPill.addEventListener('click', connectWs);

        document.getElementById('send-btn').addEventListener('click', sendCommand);

        saveLogBtn.addEventListener('click', () => {
            const lines = Array.from(logContainer.querySelectorAll('.log-line')).map((line) => {
                const stamp = line.querySelector('.stamp').textContent;
                const dir = line.querySelector('.dir').textContent;
                const chip = line.querySelector('.src-chip').textContent;
                const payload = line.querySelector('.payload').textContent;
                return stamp + ' ' + dir + ' [' + chip + '] ' + payload;
            });
            if (lines.length === 0) {
                appendLog('SYSTEM', '暂无日志可保存。');
                return;
            }
            const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'serial-log-' + fmtFileStamp() + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        clearBtn.addEventListener('click', () => {
            logContainer.innerHTML = '';
            terminalEmpty.classList.remove('hidden');
            jumpBtn.classList.remove('visible');
        });

        jumpBtn.addEventListener('click', () => {
            scrollToBottom();
            jumpBtn.classList.remove('visible');
        });

        logContainer.addEventListener('scroll', () => {
            if (isNearBottom()) jumpBtn.classList.remove('visible');
        });

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) {
                sendCommand();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (commandHistory.length === 0) return;
                if (historyIndex === -1) {
                    draftInput = cmdInput.value;
                }
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[commandHistory.length - 1 - historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex === -1) return;
                historyIndex--;
                if (historyIndex === -1) {
                    cmdInput.value = draftInput;
                } else {
                    cmdInput.value = commandHistory[commandHistory.length - 1 - historyIndex];
                }
            }
        });

        connectWs();
    </script>
</body>
</html>
